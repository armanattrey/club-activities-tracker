services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Every .sql file here runs once, on first boot of an empty volume.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: .env
    environment:
      APP_MODE: production
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    # --reload is for dev. For load tests use: --workers 4 and remove --reload.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]

  worker:
    build: ./backend
    env_file: .env
    environment:
      APP_MODE: production
    depends_on: [redis, db]
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    command: celery -A workers.celery_app worker -l info

  beat:
    build: ./backend
    env_file: .env
    environment:
      APP_MODE: production
    depends_on: [redis, db]
    volumes: ["./backend:/app"]
    # schedule file goes to /tmp so it doesn't litter your project folder
    command: celery -A workers.celery_app beat -l info -s /tmp/celerybeat-schedule

volumes:
  pgdata:
  uploads:
